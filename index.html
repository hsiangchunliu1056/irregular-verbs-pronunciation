<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="常見不規則動詞三態表，點擊單字即可播放美式英文發音。">
  <title>不規則動詞三態｜美式發音</title>
  <link rel="stylesheet" href="styles.css?v=20260816-flashcard-chinese-audio-v1">
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <p class="eyebrow">ENGLISH PRACTICE</p>
      <h1>常見不規則動詞三態</h1>
      <p class="intro">點擊英文單字可播放美式發音；點擊中文意思會依序朗讀三態英文，再唸中文意思。</p>
      <div class="phonics-guide" aria-label="常見英文拼讀組合">
        <button type="button" class="phonics-guide-sound" data-sound="picture"><b>ture</b> /tʃər/</button>
        <button type="button" class="phonics-guide-sound" data-sound="back"><b>ck</b> /k/</button>
        <button type="button" class="phonics-guide-sound" data-sound="write"><b>wr</b> /r/</button>
        <button type="button" class="phonics-guide-sound" data-sound="phone"><b>ph</b> /f/</button>
        <button type="button" class="phonics-guide-sound" data-sound="fish"><b>sh</b> /ʃ/</button>
        <button type="button" class="phonics-guide-sound" data-sound="know"><b>kn</b> /n/</button>
        <button type="button" class="phonics-guide-sound" data-sound="bridge"><b>dge</b> /dʒ/</button>
        <button type="button" class="phonics-guide-sound" data-sound="quick"><b>qu</b> /kw/</button>
        <button type="button" class="phonics-guide-sound" data-sound="see"><b>ee</b> /i/</button>
        <button type="button" class="phonics-guide-sound" data-sound="boy"><b>oy / oi</b> /ɔɪ/</button>
        <button type="button" class="phonics-guide-sound" data-sound="climb"><b>mb</b> /m/</button>
      </div>
      <div class="toolbar">
        <label class="search-field" for="search">
          <span class="sr-only">搜尋動詞或中文意思</span>
          <input id="search" type="search" placeholder="搜尋動詞或中文意思" autocomplete="off">
        </label>
        <button id="stop-speaking" type="button" disabled>停止發音</button>
      </div>
      <p id="voice-status" class="voice-status" aria-live="polite">準備就緒</p>
    </header>

    <section class="practice-panel" aria-labelledby="practice-title">
      <div>
        <p class="eyebrow">PRACTICE MODE</p>
        <h2 id="practice-title">練習模式</h2>
      </div>
      <form id="practice-form" class="practice-controls">
        <label for="practice-range">編號範圍
          <input id="practice-range" type="text" value="1-10" placeholder="例如：61-90">
        </label>
        <label for="practice-mode">模式
          <select id="practice-mode">
            <option value="flashcards">閃卡模式</option>
            <option value="quiz">考試模式</option>
          </select>
        </label>
        <button type="submit">開始練習</button>
      </form>
      <p id="practice-status" class="practice-status" aria-live="polite"></p>
      <div id="practice-area" class="practice-area" hidden></div>
    </section>

    <section class="verb-section" aria-label="不規則動詞清單">
      <div class="list-heading">
        <p id="result-count"></p>
        <p class="hint">電腦版可直接點擊；部分 Excel 習慣設定不影響此網頁。</p>
      </div>
      <div id="verb-list" class="verb-list"></div>
    </section>
  </main>
  <script src="data.js?v=20260812"></script>
  <script src="examples.js?v=20260816-homograph-ipa-v1"></script>
  <script src="phonetics.js?v=20260812-vowel-ipa-v1"></script>
  <script src="app.js?v=20260816-flashcard-chinese-audio-v1"></script>
</body>
</html>
